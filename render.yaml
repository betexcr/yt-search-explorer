services:
  - type: web
    name: yt-search-explorer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: YOUTUBE_API_KEY
        sync: false
